  <body style="background-color:#171513;color:#F1E6D3;margin:0;">
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) { return s.replace(/~and~/g, '&'); })
            .join('?');
          var nextUrl = (l.pathname.slice(0, -1) + decoded + l.hash).replace(/^\/+/, '/');
          window.history.replaceState(null, null, nextUrl);
        }
      })(window.location);
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
